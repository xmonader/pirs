[workspace]
resolver = "2"
members = [
    "crates/pirs-ai",
    "crates/pirs-agent",
    "crates/pirs-tools",
    "crates/pirs-rhai",
    "crates/pirs",
    "crates/pirs-orchestrator",
    "crates/pirs-mcp",
    "crates/pirs-graph",
    "crates/pirs-lsp",
    "crates/pirs-bench",
    "crates/pirs-bench-runner",
    "crates/pirs-claw",
    "crates/pirs-skills",
    "crates/pirs-audio",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
jsonschema = "0.28"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
futures = "0.3"
futures-util = "0.3"
rhai = { version = "1", features = ["sync", "serde", "metadata"] }
clap = { version = "4", features = ["derive", "env"] }
rustyline = "15"
regex = "1"
ignore = "0.4"
toml = "0.8"
unicode-normalization = "0.1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["trace"] }
cron = "0.15"
pirs-ai = { path = "crates/pirs-ai" }
pirs-agent = { path = "crates/pirs-agent" }
pirs-tools = { path = "crates/pirs-tools" }
pirs-skills = { path = "crates/pirs-skills" }
pirs-rhai = { path = "crates/pirs-rhai" }
pirs-mcp = { path = "crates/pirs-mcp" }
pirs-graph = { path = "crates/pirs-graph" }
pirs-lsp = { path = "crates/pirs-lsp" }


[workspace.lints.clippy]
# Style lints that create large mechanical diffs; correctness still checked by tests.
too_many_arguments = "allow"
large_enum_variant = "allow"
needless_return = "allow"
redundant_closure = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
manual_clamp = "allow"
uninlined_format_args = "allow"
doc_lazy_continuation = "allow"
match_like_matches_macro = "allow"
manual_pattern_char_comparison = "allow"
needless_lifetimes = "allow"
await_holding_lock = "allow"
field_reassign_with_default = "allow"
derivable_impls = "allow"
manual_strip = "allow"
if_same_then_else = "allow"
unnecessary_to_owned = "allow"
map_identity = "allow"
unnecessary_lazy_evaluations = "allow"
redundant_closure_for_method_calls = "allow"
single_char_add_str = "allow"
ptr_arg = "allow"
needless_borrows_for_generic_args = "allow"
explicit_auto_deref = "allow"
manual_contains = "allow"
iter_overeager_cloned = "allow"
cloned_instead_of_copied = "allow"
unnecessary_map_or = "allow"
manual_unwrap_or_default = "allow"
assertions_on_constants = "allow"
empty_line_after_doc_comments = "allow"

[workspace.lints.rust]
# unused_imports remain deny via -D warnings once fixed
